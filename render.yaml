services:
  - type: web
    name: domain-blacklist-checker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      # --- Spamhaus DQS key ---
      # Paste ONLY the key string from https://portal.spamhaus.com
      # e.g.  abcd1234efgh5678   (NOT the full hostname)
      # The app automatically rewrites Spamhaus zones to DQS format:
      #   zen.spamhaus.org  ->  <key>.zen.dq.spamhaus.net
      - key: DBC_DQS_KEY
        sync: false   # set manually in Render dashboard (keep key secret)
      # Trust "listed" answers from OTHER key-required lists (Barracuda, Abusix,
      # invaluement, SpamRats, Sender Score). Keep this "false" unless you have
      # paid/authorized access to those lists: without it they often answer
      # "listed" to everyone, which creates FALSE listings. Spamhaus does NOT
      # need this. The DQS key above already authorizes ZEN + DBL on its own.
      - key: DBC_TRUST_KEYED
        value: "false"
      # Trust X-Forwarded-For from Render's edge proxy for accurate rate limiting.
      - key: DBC_TRUST_PROXY
        value: "true"
      # Cache: 15 min TTL, max 2000 entries (safe for free 512 MB RAM)
      - key: DBC_CACHE_TTL_MS
        value: "900000"
      - key: DBC_CACHE_MAX
        value: "2000"
      # Rate limit: 20 req/min per IP (free tier is single-instance anyway)
      - key: DBC_RATE_MAX
        value: "20"
      # Bulk: keep concurrency low to avoid hammering DNSBLs on free tier
      - key: DBC_BULK_MAX
        value: "50"
      - key: DBC_BULK_CONCURRENCY
        value: "3"
